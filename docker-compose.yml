services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thunderfall}
      POSTGRES_USER: ${POSTGRES_USER:-thunderfall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: src/Platform/Thunderfall.Api/Dockerfile
    command: [--migrate]
    environment:
      ConnectionStrings__Game: Host=postgres;Database=${POSTGRES_DB:-thunderfall};Username=${POSTGRES_USER:-thunderfall};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: src/Platform/Thunderfall.Api/Dockerfile
    environment:
      ConnectionStrings__Game: Host=postgres;Database=${POSTGRES_DB:-thunderfall};Username=${POSTGRES_USER:-thunderfall};Password=${POSTGRES_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 20s
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:${WEB_PORT:-8085}:80'
    depends_on:
      - api
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/health/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
