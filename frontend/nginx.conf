server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $http_host; }
 location /health/ { proxy_pass http://api:8080; }
 location /openapi/ { proxy_pass http://api:8080; }
 location / { try_files $uri $uri/ /index.html; }
}
