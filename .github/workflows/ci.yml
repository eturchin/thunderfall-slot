name: Thunderfall verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: thunderfall
          POSTGRES_USER: thunderfall
          POSTGRES_PASSWORD: ci-local-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U thunderfall" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TF_TEST_POSTGRES: Host=localhost;Database=thunderfall;Username=thunderfall;Password=ci-local-only
      ConnectionStrings__Game: Host=localhost;Database=thunderfall;Username=thunderfall;Password=ci-local-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet restore --locked-mode
      - name: Rebuild with analyzers
        run: dotnet build -c Release --no-restore -t:Rebuild
      - run: dotnet test -c Release --no-build --logger trx
      - run: dotnet run --project src/Platform/Thunderfall.Api -c Release --no-build -- --migrate
      - run: npm ci && npm run lint && npm run build && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API and wait for readiness
        shell: bash
        run: |
          dotnet src/Platform/Thunderfall.Api/bin/Release/net10.0/Thunderfall.Api.dll --urls http://127.0.0.1:5090 > "$RUNNER_TEMP/thunderfall-api.log" 2>&1 &
          api_pid=$!
          echo "$api_pid" > "$RUNNER_TEMP/thunderfall-api.pid"
          for attempt in {1..60}; do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/thunderfall-api.log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:5090/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/thunderfall-api.log"
          echo "API did not become ready within 60 seconds."
          exit 1
      - name: Chromium end-to-end tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_PREVIEW: '1'
      - name: Build production containers
        run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-local-only
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            tests/**/TestResults/*.trx
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/thunderfall-api.log
      - name: Stop API
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/thunderfall-api.pid" ]; then
            read -r api_pid < "$RUNNER_TEMP/thunderfall-api.pid"
            kill "$api_pid" 2>/dev/null || true
          fi
