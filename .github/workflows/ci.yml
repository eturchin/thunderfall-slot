name: Thunderfall verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: thunderfall
          POSTGRES_USER: thunderfall
          POSTGRES_PASSWORD: ci-local-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U thunderfall" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TF_TEST_POSTGRES: Host=localhost;Database=thunderfall;Username=thunderfall;Password=ci-local-only
      ConnectionStrings__Game: Host=localhost;Database=thunderfall;Username=thunderfall;Password=ci-local-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger trx
      - run: dotnet run --project src/Platform/Thunderfall.Api -c Release --no-build -- --migrate
      - run: npm ci && npm run lint && npm run build && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: dotnet run --project src/Platform/Thunderfall.Api -c Release --no-build --urls http://127.0.0.1:5090 > /tmp/thunderfall-api.log 2>&1 &
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_PREVIEW: '1'
      - run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-local-only
